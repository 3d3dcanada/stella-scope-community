name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Formatting
        run: cargo fmt --check
      - name: Rust tests
        run: cargo test --locked -j 2
      - name: Release build
        run: cargo build --release --locked -j 2
      - name: Interface tests
        run: |
          for t in scripts/*-tests.mjs; do
            echo "== $t"
            node "$t" || exit 1
          done
      - name: HTTP smoke tests
        run: |
          node scripts/service-http-smoke.mjs
          node scripts/workspace-http-smoke.mjs
          node scripts/investigation-smoke.mjs

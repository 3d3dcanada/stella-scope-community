name: Feature request
description: Suggest something new
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first. We keep the project small on purpose, so a clear reason helps. For a large change, please open this before writing code.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Who is affected and how often?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What do you do today instead?
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: dropdown
    id: touches
    attributes:
      label: Does it only read and show, or does it send commands to a printer?
      options:
        - Only reads and shows
        - It sends commands or changes printer settings
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Would you like to build it?
      options:
        - Yes
        - Yes, with some guidance
        - No
    validations:
      required: true
